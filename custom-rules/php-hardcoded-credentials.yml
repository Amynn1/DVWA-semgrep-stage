rules:
  - id: php-hardcoded-credentials
    languages:
      - php
    message: Identifiant potentiellement codé en dur dans le code source.
    severity: WARNING
    metadata:
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $VAR = "...";
          - pattern: define("...", "...");
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|passwd|pwd|secret|api_key|token).*